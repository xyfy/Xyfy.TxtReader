<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Xyfy TXT Reader</title>
    <meta http-equiv="refresh" content="0; url=web/" />
    <script>
      // 站点根目录只是入口：GitHub Pages 的源是仓库根目录，没有 index.html 时
      // 会退化成渲染 README 的介绍页，所以这里统一转发到真正的站点版（web/）。
      location.replace("web/" + location.search + location.hash);
    </script>
  </head>
  <body>
    <p>
      正在进入阅读器……如未自动跳转，请
      <a href="web/">点击这里</a>。
    </p>
  </body>
</html>
